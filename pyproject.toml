[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-factory"
version = "0.1.0"
description = "Traceable short-video production pipeline for WeChat Video Accounts"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "pypdf>=5", "yt-dlp>=2026.6.9"]

[project.scripts]
video-factory = "video_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
